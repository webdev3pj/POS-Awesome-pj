<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "POS Relay" }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --line: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --brand: #38bdf8;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .nav a {
        color: var(--brand);
        text-decoration: none;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h1, h2, h3 {
        margin: 0 0 10px 0;
      }
      input, textarea, button, select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: #0b1220;
        color: var(--text);
      }
      button {
        background: #1d4ed8;
        border: none;
        cursor: pointer;
      }
      button.secondary {
        background: #334155;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .grid.cols-2 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      .muted { color: var(--muted); }
      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        border: 1px solid var(--line);
      }
      .queued { color: var(--warn); }
      .done { color: var(--ok); }
      .failed { color: var(--err); }
      .flash {
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 8px;
        background: #1e293b;
        border: 1px solid var(--line);
      }
      code {
        background: #0b1220;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .actions > * {
        width: auto;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .small {
        font-size: 12px;
      }
      .nowrap {
        white-space: nowrap;
      }
      .wrap-anywhere {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .code-block {
        max-height: 180px;
        overflow: auto;
        display: block;
        white-space: pre-wrap;
      }
      details summary {
        cursor: pointer;
        color: var(--brand);
      }
      .table-scroll {
        overflow-x: auto;
      }
      .pill.synced {
        color: var(--ok);
      }
      .pill.pending {
        color: var(--warn);
      }
      .pill.error {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="nav">
        <a href="/">Dashboard</a>
        <a href="/setup">System Setup</a>
        <a href="/queue">Queue</a>
        <a href="/health">Health JSON</a>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
