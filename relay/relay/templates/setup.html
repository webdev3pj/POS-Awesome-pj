{% extends "base.html" %}

{% block content %}
<div class="card">
  <h1>System Setup</h1>
  <p class="muted">Configure OptiPlex relay and Frappe Cloud credentials.</p>
  <form method="post" action="/setup">
    <div class="grid cols-2">
      <div>
        <label>Frappe Base URL</label>
        <input name="frappe_base_url" value="{{ config.frappe_base_url }}" placeholder="https://yoursite.frappe.cloud" />
      </div>
      <div>
        <label>Site Name (optional)</label>
        <input name="site_name" value="{{ config.site_name }}" placeholder="your-site" />
      </div>
      <div>
        <label>API Key</label>
        <input name="api_key" value="{{ config.api_key }}" />
      </div>
      <div>
        <label>API Secret</label>
        <input name="api_secret" value="{{ config.api_secret }}" />
      </div>
      <div>
        <label>Relay Host</label>
        <input name="relay_host" value="{{ config.relay_host }}" placeholder="0.0.0.0" />
      </div>
      <div>
        <label>Relay Port</label>
        <input type="number" name="relay_port" value="{{ config.relay_port }}" />
      </div>
      <div>
        <label>Public Relay URL (for ERPNext reachability checks)</label>
        <input name="public_base_url" value="{{ config.public_base_url }}" placeholder="https://relay.yourdomain.com or https://xxxx.ngrok.app" />
      </div>
      <div>
        <label>Allowed Subnet</label>
        <input name="allowed_subnet" value="{{ config.allowed_subnet }}" placeholder="192.168.50.0/24" />
      </div>
      <div>
        <label>Queue Poll Seconds</label>
        <input type="number" name="poll_seconds" value="{{ config.poll_seconds }}" />
      </div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button type="submit">Save Configuration</button>
    </div>
  </form>
</div>

<div class="card">
  <h2>Windows Bootstrap</h2>
  <p class="muted">One-click helper for firewall rule and startup task on OptiPlex.</p>
  <form method="post" action="/setup/bootstrap">
    <div class="actions">
      <button type="submit">Run Windows Bootstrap</button>
    </div>
  </form>
  <p class="muted" style="margin-top:8px">
    Uses current relay port <code>{{ config.relay_port }}</code>.
  </p>
</div>
{% endblock %}
